  <circle cx="256" cy="256" r="240" fill="#1e3a5f"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="12"/>
  <!-- Inner rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Bullseye -->
  <circle cx="256" cy="256" r="40" fill="#e63946"/>
