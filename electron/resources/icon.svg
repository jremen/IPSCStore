  <!-- Crosshairs -->
  <line x1="256" y1="16" x2="256" y2="496" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="16" y1="256" x2="496" y2="256" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- Score text -->
