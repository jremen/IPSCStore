appId: com.ipscscore.app
productName: IPSCScore
copyright: Copyright © 2025 IPSCScore

directories:
  output: ../dist-electron
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: dist-backend
    to: backend-dist
    filter:
      - "**/*"
  - from: resources/pg
    to: pg
    filter:
      - "**/*"
  - from: resources/seed-data.dump
    to: seed-data.dump

mac:
  target: dmg
  icon: resources/icon.icns
  category: public.app-category.utilities
  # Hardened runtime needed for macOS distribution
  # hardenedRuntime: true
  # entitlements: resources/entitlements.mac.plist

win:
  target: nsis
  icon: resources/icon.ico

linux:
  target: AppImage
  icon: resources/icon.png
  category: Utility