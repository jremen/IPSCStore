appId: com.ipscscore.app
productName: IPSCScore
copyright: Copyright © 2026 IPSCScore

directories:
  output: ../dist-electron
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: dist-backend
    to: backend-dist
    filter:
      - "**/*"
  - from: resources/pg
    to: pg
    filter:
      - "**/*"
  - from: resources/seed-data.dump
    to: seed-data.dump

# After each arch build, thin universal PG binaries to single-arch
# so the universal merger can LIPO-merge them back properly.
afterPack: scripts/afterPack.js

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: resources/icon.icns
  category: public.app-category.utilities
  # Hardened runtime needed for macOS distribution
  # hardenedRuntime: true
  # entitlements: resources/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: Utility
